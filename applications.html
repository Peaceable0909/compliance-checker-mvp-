<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Applications — Compliance Checker</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="shell">
    <div class="panel-head">
      <div>
        <span class="eyebrow">Workspace</span>
        <h1>Applications</h1>
      </div>
      <button id="new-app-btn">New application</button>
    </div>

    <div id="notice-slot"></div>

    <div class="panel" id="new-app-panel" style="display:none;">
      <div class="panel-head"><h2>New application</h2></div>
      <div class="grid-2">
        <div>
          <h3>Student</h3>
          <div class="field">
            <label for="stu-existing">Existing student</label>
            <select id="stu-existing"><option value="">— New student —</option></select>
          </div>
          <div id="new-stu-fields">
            <div class="field"><label for="stu-name">Full name</label><input id="stu-name" placeholder="Jane Doe" /></div>
            <div class="field-row">
              <div class="field"><label for="stu-dob">Date of birth</label><input id="stu-dob" type="date" /></div>
              <div class="field"><label for="stu-nat">Nationality</label><input id="stu-nat" placeholder="e.g. Nigerian" /></div>
            </div>
            <div class="field-row">
              <div class="field"><label for="stu-passport">Passport number</label><input id="stu-passport" placeholder="A1234567" /></div>
              <div class="field"><label for="stu-email">Email</label><input id="stu-email" type="email" placeholder="student@example.com" /></div>
            </div>
          </div>
        </div>
        <div>
          <h3>Placement</h3>
          <div class="field"><label for="app-country">Country</label><select id="app-country"><option value="">Select country</option></select></div>
          <div class="field"><label for="app-university">University</label><select id="app-university" disabled><option value="">Select a country first</option></select></div>
          <div class="field"><label for="app-programme">Programme</label><select id="app-programme" disabled><option value="">Select a university first</option></select></div>
          <div class="field"><label for="app-intake">Intake</label><input id="app-intake" placeholder="e.g. Jan 2027" /></div>
        </div>
      </div>
      <div class="field-row" style="margin-top:8px;">
        <button id="create-app-btn">Create application</button>
        <button class="secondary" id="cancel-app-btn">Cancel</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><span class="eyebrow">All applications</span></div>
      <div id="app-list"><p style="color:var(--ink-soft);">Loading…</p></div>
    </div>
  </div>

  <script src="assets/config.js"></script>
  <script type="module">
    import { requireSession, wireTopbar } from "./assets/auth.js";
    import { renderTopbar } from "./assets/topbar.js";
    import { supabase } from "./assets/supabase-client.js";

    renderTopbar("applications.html");
    const session = await requireSession();
    if (session) {
      wireTopbar(session.user.email);
      init(session.user.id);
    }

    const noticeSlot = document.getElementById("notice-slot");
    function showNotice(kind, msg) { noticeSlot.innerHTML = `<div class="notice ${kind}">${msg}</div>`; }

    async function init(userId) {
      await loadStudents(userId);
      await loadReferenceData();
      await loadApplications(userId);

      if (new URLSearchParams(window.location.search).get("new") === "1") {
        document.getElementById("new-app-panel").style.display = "block";
      }

      document.getElementById("new-app-btn").addEventListener("click", () => {
        document.getElementById("new-app-panel").style.display = "block";
      });
      document.getElementById("cancel-app-btn").addEventListener("click", () => {
        document.getElementById("new-app-panel").style.display = "none";
      });
      document.getElementById("stu-existing").addEventListener("change", (e) => {
        document.getElementById("new-stu-fields").style.display = e.target.value ? "none" : "block";
      });
      document.getElementById("app-country").addEventListener("change", populateUniversities);
      document.getElementById("app-university").addEventListener("change", populateProgrammes);
      document.getElementById("create-app-btn").addEventListener("click", () => createApplication(userId));
    }

    async function loadStudents(userId) {
      const { data, error } = await supabase.from("students").select("id, full_name").eq("owner_id", userId).order("full_name");
      if (error) { showNotice("error", error.message); return; }
      const sel = document.getElementById("stu-existing");
      for (const s of data || []) {
        const opt = document.createElement("option");
        opt.value = s.id; opt.textContent = s.full_name;
        sel.appendChild(opt);
      }
    }

    let countries = [], universities = [], programmes = [];

    async function loadReferenceData() {
      const [countryResult, universityResult, programmeResult] = await Promise.all([
        supabase.from("countries").select("id, name").order("name"),
        supabase.from("universities").select("id, name, country_id").order("name"),
        supabase.from("programmes").select("id, name, university_id, level").order("name"),
      ]);
      const firstError = countryResult.error || universityResult.error || programmeResult.error;
      if (firstError) { showNotice("error", firstError.message); return; }
      countries = countryResult.data || []; universities = universityResult.data || []; programmes = programmeResult.data || [];
      const countrySelect = document.getElementById("app-country");
      countrySelect.innerHTML = `<option value="">Select country</option>` + countries.map((row) => `<option value="${row.id}">${escapeHtml(row.name)}</option>`).join("");
    }

    function escapeHtml(value) { return String(value ?? "").replace(/[&<>\"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '\"': "&quot;", "'": "&#39;" }[c])); }
    function populateUniversities() {
      const countryId = document.getElementById("app-country").value;
      const universitySelect = document.getElementById("app-university");
      const programmeSelect = document.getElementById("app-programme");
      const filtered = universities.filter((row) => row.country_id === countryId);
      universitySelect.disabled = !countryId; universitySelect.innerHTML = `<option value="">Select university</option>` + filtered.map((row) => `<option value="${row.id}">${escapeHtml(row.name)}</option>`).join("");
      programmeSelect.disabled = true; programmeSelect.innerHTML = `<option value="">Select a university first</option>`;
    }
    function populateProgrammes() {
      const universityId = document.getElementById("app-university").value;
      const programmeSelect = document.getElementById("app-programme");
      const filtered = programmes.filter((row) => row.university_id === universityId);
      programmeSelect.disabled = !universityId; programmeSelect.innerHTML = `<option value="">Select programme</option>` + filtered.map((row) => `<option value="${row.id}">${escapeHtml(row.name)}${row.level ? ` · ${escapeHtml(row.level)}` : ""}</option>`).join("");
    }

    async function loadApplications(userId) {
      const { data, error } = await supabase
        .from("applications")
        .select("id, intake, status, overall_status, updated_at, students(full_name), universities(name), programmes(name)")
        .eq("owner_id", userId)
        .order("updated_at", { ascending: false });

      const list = document.getElementById("app-list");
      if (error) { list.innerHTML = `<div class="notice error">${error.message}</div>`; return; }
      if (!data || data.length === 0) {
        list.innerHTML = `<div class="empty-state">No applications yet. Create one above to start a compliance review.</div>`;
        return;
      }
      list.innerHTML = data.map(rowHtml).join("");
    }

    function stampClass(status) {
      if (status === "green") return "green";
      if (status === "yellow") return "yellow";
      if (status === "red") return "red";
      return "grey";
    }

    function rowHtml(app) {
      const stamp = app.overall_status
        ? `<span class="stamp ${stampClass(app.overall_status)}">${app.overall_status}</span>`
        : `<span class="stamp grey">not run</span>`;
      return `
        <div class="list-row">
          <div>
            <div class="title">${app.students?.full_name ?? "Unnamed student"} — ${app.universities?.name ?? "No university set"}</div>
            <div class="meta">${app.programmes?.name ?? "No programme set"} · ${app.intake ?? "intake tbd"} · status: ${app.status}</div>
          </div>
          <div style="display:flex; align-items:center; gap:14px;">
            ${stamp}
            <a class="btn secondary" href="application.html?id=${app.id}">Open</a>
          </div>
        </div>`;
    }

    async function createApplication(userId) {
      try {
        const existingStudentId = document.getElementById("stu-existing").value;
        let studentId = existingStudentId || null;

        if (!studentId) {
          const name = document.getElementById("stu-name").value.trim();
          if (!name) { showNotice("error", "Student full name is required."); return; }
          const { data: stu, error: stuErr } = await supabase.from("students").insert({
            owner_id: userId,
            full_name: name,
            date_of_birth: document.getElementById("stu-dob").value || null,
            nationality: document.getElementById("stu-nat").value.trim() || null,
            passport_number: document.getElementById("stu-passport").value.trim() || null,
            email: document.getElementById("stu-email").value.trim() || null,
          }).select("id").single();
          if (stuErr) throw stuErr;
          studentId = stu.id;
        }

        const countryId = document.getElementById("app-country").value || null;
        const universityId = document.getElementById("app-university").value || null;
        const programmeId = document.getElementById("app-programme").value || null;
        if (!countryId || !universityId || !programmeId) { showNotice("error", "Select a country, university, and programme before creating the application."); return; }

        const { data: app, error: appErr } = await supabase.from("applications").insert({
          owner_id: userId,
          student_id: studentId,
          country_id: countryId,
          university_id: universityId,
          programme_id: programmeId,
          intake: document.getElementById("app-intake").value.trim() || null,
          status: "draft",
        }).select("id").single();
        if (appErr) throw appErr;

        window.location.href = `application.html?id=${app.id}`;
      } catch (err) {
        showNotice("error", err.message || "Could not create application.");
      }
    }

  </script>
</body>
</html>
